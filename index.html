<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | College Attendance Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="container">

        <div class="main">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
            </div>
            <h1 class="heading">College Attendance<br>Management System</h1>
            <p class="instruction">Sign in to access your account</p>
        </div>
        
        <form class="login-form">
            <div class="input-box">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                
                <label for="register-number" class="visually-hidden">
                    Register Number / Employee ID
                </label>
                <input 
                    type="text"
                    id="register-number"
                    name="register-number" 
                    placeholder="Enter your Register Number / Employee ID"
                    required
                >
            </div>
            
            <div class="input-box">
                <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                
                <label for="date-of-birth" class="visually-hidden">
                    Date Of Birth
                </label>
                <input 
                    type="date"
                    id="date-of-birth"
                    name="date-of-birth"
                    required
                >
            </div>

            <button type="submit">Login</button>
        </form>
        
        <div class="divider">
            <span></span>
            <span>OR</span>
            <span></span>
        </div>
        
        <p class="access">Access As</p>
        
        <div class="role-buttons">
            <button type="button" class="role-button student">Student</button>
            <button type="button" class="role-button faculty">Faculty</button>
            <button type="button" class="role-button advisor">Class<br>Adviser</button>
        </div>
    </main>
</body>
</html>
